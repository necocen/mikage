[package]
name = "mikage-web-completion"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
mikage = { path = "../../..", default-features = false }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "s"
lto = true
