[package]
name = "mikage-simulation-control"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
mikage = { path = "../../..", default-features = false, features = ["window-gui"] }
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = "s"
lto = true
