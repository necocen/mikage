[package]
name = "mikage"
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[features]
default = ["window-gui"]
window = ["dep:winit"]
gui = ["dep:egui", "dep:egui-wgpu"]
window-gui = ["window", "gui", "dep:egui-winit"]
agent = ["dep:image", "dep:serde", "dep:serde_json", "wgpu/serde"]
webgl = ["wgpu/webgl"]

[dependencies]
wgpu = "30.0.1"
dpi = "0.1"
winit = { version = "0.30.13", optional = true }
egui = { version = "=0.36.1", optional = true }
egui-wgpu = { version = "=0.36.1", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
egui-winit = { path = "vendor/egui-winit", optional = true }
pollster = "0.4"

[target.'cfg(target_family = "wasm")'.dependencies]
egui-winit = { path = "vendor/egui-winit", optional = true, default-features = false, features = ["links"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Node", "ResizeObserver", "ResizeObserverEntry", "ResizeObserverSize"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
tracing-web = "0.1"
console_error_panic_hook = "0.1"
web-time = "1"

[[bin]]
name = "mikage-wasm-demo"
path = "src/bin/mikage-wasm-demo.rs"
required-features = ["window-gui"]

[[example]]
name = "boids"
required-features = ["window-gui"]

[[example]]
name = "clear"
required-features = ["window-gui"]

[[example]]
name = "custom_instance"
required-features = ["window-gui"]

[[example]]
name = "egui_demo"
required-features = ["window-gui"]

[[example]]
name = "instancing_2d"
required-features = ["window-gui"]

[[example]]
name = "instancing_3d"
required-features = ["window-gui"]

[[example]]
name = "orbit_camera"
required-features = ["window-gui"]

[[example]]
name = "agent_capture"
required-features = ["window", "agent"]
