name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
  RUST_VERSION: "1.95.0"

jobs:
  quality:
    name: Format, lint and CPU tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
      - name: Select Rust
        run: rustup override set "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: quality
      - run: cargo fmt --all -- --check
      - run: cargo clippy --lib --features agent -- -D warnings
      - run: cargo test --lib --features agent -- --skip ::gpu_
      - run: cargo test --doc --features agent

  features:
    name: Features (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
      - name: Select Rust
        run: rustup override set "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: features
      - run: bash scripts/check-features.sh
      - name: Check external surface consumer
        if: runner.os == 'macOS'
        run: cargo check --manifest-path tests/fixtures/external-surface/Cargo.toml

  gpu:
    name: GPU tests (Vulkan / Lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIKAGE_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Select Rust
        run: rustup override set "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: gpu
      - name: Install Lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libvulkan1 mesa-vulkan-drivers vulkan-tools ripgrep
          icd=$(dpkg -L mesa-vulkan-drivers | rg '/lvp_icd[^/]*\.json$')
          test -f "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          mkdir -m 700 "$RUNNER_TEMP/xdg-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
      - name: Verify software adapter
        run: |
          vulkaninfo --summary 2>&1 | tee vulkan-info.log
          rg -i 'deviceName\s*=.*llvmpipe' vulkan-info.log
      - name: Test GPU readback and capture workers
        run: cargo test --lib --features agent ::gpu_ -- --test-threads=1 --nocapture 2>&1 | tee gpu-readback.log
      - name: Test rendering, compute and runtime
        run: cargo test --features agent --test gpu --test runtime -- --test-threads=1 --nocapture 2>&1 | tee gpu-tests.log
      - name: Upload GPU diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gpu-failure-diagnostics
          path: |
            vulkan-info.log
            gpu-readback.log
            gpu-tests.log
            tests/snapshots/*.png
          retention-days: 7
